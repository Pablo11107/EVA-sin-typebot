name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      # Acción fijada por commit, no por etiqueta, para que no pueda cambiar sin aviso.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Recorre todos los caminos del flujo con el motor y revisa la burbuja.
      - run: node pruebas.mjs
      # Seguridad y accesibilidad en Chrome (el runner de GitHub lo trae instalado).
      - run: npm ci --no-audit --no-fund
      - run: node pruebas-navegador.mjs
        env:
          EVA_CHROME: /usr/bin/google-chrome
